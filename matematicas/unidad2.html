<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unidad: Nombre de la Unidad</title>

  <!-- FAVICON -->
  <link rel="icon" href="favicon.ico" type="image/x-icon">

  <style>
    :root {
      --bg-color: #070d18;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --teal-accent: #00b4b6;
      --card-bg: #111a2e;
      --border-color: #1e293b;
    }

    body.light-mode {
      --bg-color: #f8fafc;
      --text-main: #0f172a;
      --text-sub: #475569;
      --teal-accent: #008b8b;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ENCABEZADO */
    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .header-logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      background-color: #ffffff;
      border-radius: 12px;
      padding: 4px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .header-title-box {
      text-align: center;
      flex: 1;
    }

    .header-title-box h1 {
      color: var(--teal-accent);
      font-size: 1.8rem;
      margin: 0 0 6px 0;
      font-weight: 700;
    }

    .header-title-box h2 {
      font-size: 1.15rem;
      font-weight: 600;
      margin: 0 0 6px 0;
      color: var(--text-main);
    }

    .header-title-box p {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin: 0;
    }

    /* BOTÓN DE TEMA */
    .theme-toggle-container {
      text-align: center;
      margin-top: 14px;
    }

    .btn-theme {
      background-color: #111827;
      color: #ffffff;
      border: 1px solid #374151;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.2s, background-color 0.2s;
    }

    body.light-mode .btn-theme {
      background-color: #ffffff;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    .btn-theme:hover {
      transform: translateY(-1px);
    }

    /* NAVEGACIÓN DE SECCIONES */
    .nav-tabs {
      display: flex;
      gap: 12px;
      margin: 16px auto 0 auto;
      max-width: 1200px;
    }

    .tab-btn {
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background-color: var(--teal-accent);
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO -->
  <header class="header-container">
    <div class="header-top">
      <!-- Logo Izquierdo -->
      <img src="cecyte_logo.png" alt="Logo CECyTE" class="header-logo">

      <!-- Textos Centrales -->
      <div class="header-title-box">
        <h1>Unidad 2: Nombre de la Unidad Aquí</h1>
        <h2>Guía Interactiva de Examen Paso a Paso</h2>
        <p>CECyTEM 05 Guacamayas — M.C. Edgar Campos Díaz</p>
      </div>

      <!-- Logo Derecho -->
      <img src="profe_campos_logo.png" alt="Logo Profe Campos" class="header-logo">
    </div>

    <!-- Botón Modo Claro / Oscuro -->
    <div class="theme-toggle-container">
      <button class="btn-theme" onclick="toggleTheme()">
        <span id="theme-icon">🌻</span> Cambiar Modo Claro / Oscuro
      </button>
    </div>
  </header>

  <!-- SECCIONES / PESTAÑAS -->
  <nav class="nav-tabs">
    <button class="tab-btn active">Sección I: Nombre de la Sección</button>
    <button class="tab-btn">Secciones II y III: Nombre de la Sección</button>
  </nav>

  <!-- SCRIPT MODO CLARO / OSCURO -->
  <script>
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const icon = document.getElementById('theme-icon');
      if (document.body.classList.contains('light-mode')) {
        icon.textContent = '🌙';
      } else {
        icon.textContent = '🌻';
      }
    }
  </script>

</body>
</html>
